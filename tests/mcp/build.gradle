plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.minecraftforge.gradle'
}

group = 'net.minecraftforge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

configurations {
    // Un-linked configrations so that we don't have multiple on the compile classpath
    client
    server
}

mappings {
    channel = 'official'
    version = '1.20.2'
}

dependencies {
    implementation fg.mcp('1.20.2-20230921.100330') // == fg.mcp('de.oceanlabs.mcp:mcp_config-joined:1.20.2-20230921.100330')
    //client fg.mcpClient('1.20.2-20230921.100330') // == fg.mcp('de.oceanlabs.mcp:mcp_config-client:1.20.2-20230921.100330')
    //server fg.mcpServer('1.20.2-20230921.100330') // == fg.mcp('de.oceanlabs.mcp:mcp_config-server:1.20.2-20230921.100330')
}