plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.minecraftforge.gradle'
}

group = 'net.minecraftforge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

configurations {
    // Un-linked configrations so that we don't have multiple on the compile classpath
    client
    server
}

dependencies {
    implementation fg.vanilla('1.20.2') // == fg.vanilla('net.minecraft:joined:1.20.2')
    client fg.vanilla('net.minecraft:client:1.20.2')
    server fg.vanilla('net.minecraft:server:1.20.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.warnings = false // Shutup deprecated for removal warnings
}